<title>Kolmeia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAF9F6; --sunken:#EEECE6;
  --line:#E3E0D8; --line-2:#CDC9BE; --ink:#15171C; --ink-2:#464A53; --muted:#6B6F79;
  --accent:#E9A21B; --accent-ink:#8A5700; --accent-soft:#FCF1D9; --accent-line:#EDC56E; --on-accent:#1A1404;
  --primary:#15171C; --on-primary:#FFFFFF; --primary-hover:#2A2D35;
  --side-bg:#15171C; --side-ink:#EDEBE5; --side-muted:#8C8F98; --side-hover:#23262D; --side-line:#262930;
  --ok:#23774A; --ok-soft:#E3F2E8; --info:#2C5AA0; --info-soft:#E5EDF8; --bad:#B3322A; --bad-soft:#F8E4E1;
  --violet:#6B4FA3; --violet-soft:#EEE8F7; --teal:#1F6E73; --teal-soft:#E0F0F0; --gray:#5E626B; --gray-soft:#ECEBE7;
  --focus:#2C5AA0; --chart-a:#3A404D; --chart-b:#E9A21B; --grid:#E8E5DE; --scrim:rgba(21,23,28,.42);
  --pop-shadow:0 10px 30px rgba(21,23,28,.14), 0 1px 3px rgba(21,23,28,.08);
  --strip-bg:#FCF1D9; --strip-ink:#6E4600;
  --f-display:'Geologica', 'Onest', system-ui, sans-serif;
  --f-ui:'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --side-w:64px; --top-h:56px; --r:6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --surface:#17191D; --surface-2:#1B1D22; --sunken:#121317;
    --line:#2A2D33; --line-2:#3B3F47; --ink:#ECEAE4; --ink-2:#BDBBB4; --muted:#8E919A;
    --accent:#F0AE36; --accent-ink:#F4C262; --accent-soft:#2D2310; --accent-line:#6B5220; --on-accent:#1A1404;
    --primary:#ECEAE4; --on-primary:#15171C; --primary-hover:#FFFFFF;
    --side-bg:#0A0B0D; --side-ink:#ECEAE4; --side-muted:#7E818A; --side-hover:#1C1E23; --side-line:#1F2126;
    --ok:#5CC58A; --ok-soft:#14281D; --info:#86ACE8; --info-soft:#172235; --bad:#EF8076; --bad-soft:#35191A;
    --violet:#B7A0EA; --violet-soft:#241D33; --teal:#6CC4C8; --teal-soft:#122829; --gray:#A6A9B1; --gray-soft:#24262B;
    --focus:#86ACE8; --chart-a:#9AA1B1; --chart-b:#F0AE36; --grid:#24272D; --scrim:rgba(0,0,0,.6);
    --pop-shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    --strip-bg:#2D2310; --strip-ink:#F4C262;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#17191D; --surface-2:#1B1D22; --sunken:#121317;
  --line:#2A2D33; --line-2:#3B3F47; --ink:#ECEAE4; --ink-2:#BDBBB4; --muted:#8E919A;
  --accent:#F0AE36; --accent-ink:#F4C262; --accent-soft:#2D2310; --accent-line:#6B5220; --on-accent:#1A1404;
  --primary:#ECEAE4; --on-primary:#15171C; --primary-hover:#FFFFFF;
  --side-bg:#0A0B0D; --side-ink:#ECEAE4; --side-muted:#7E818A; --side-hover:#1C1E23; --side-line:#1F2126;
  --ok:#5CC58A; --ok-soft:#14281D; --info:#86ACE8; --info-soft:#172235; --bad:#EF8076; --bad-soft:#35191A;
  --violet:#B7A0EA; --violet-soft:#241D33; --teal:#6CC4C8; --teal-soft:#122829; --gray:#A6A9B1; --gray-soft:#24262B;
  --focus:#86ACE8; --chart-a:#9AA1B1; --chart-b:#F0AE36; --grid:#24272D; --scrim:rgba(0,0,0,.6);
  --pop-shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --strip-bg:#2D2310; --strip-ink:#F4C262;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ws{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 10px 5px 6px;cursor:pointer;min-width:0}
.ws .ws-ic{width:24px;height:24px;display:grid;place-items:center;background:var(--sunken);font:600 11px var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ws .ws-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-logo{display:none}
.top-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--surface);white-space:nowrap;cursor:pointer}
.pill b{font-weight:600}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:var(--r);cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.me{width:32px;height:32px;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:600 12px var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border:0;cursor:pointer;flex:none}
.strip{display:flex;align-items:center;gap:8px;background:var(--strip-bg);color:var(--strip-ink);font-size:12px;padding-block:4px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.strip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pop{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--pop-shadow);padding:6px;min-width:220px}
.pop button,.pop .pi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:4px;text-align:left;cursor:pointer;color:var(--ink)}
.pop button:hover{background:var(--sunken)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop .ph{padding:6px 10px 4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* page wrapper: the one outer gutter */
.page{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 96px;max-width:1440px;width:100%;min-width:0}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph-row > div{min-width:0}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sub{color:var(--muted);margin-top:4px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunken)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.p:hover{background:var(--primary-hover)}
.btn.a{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card.pad{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:16px}
.sect-t{font:600 11.5px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap;background:var(--gray-soft);color:var(--gray);line-height:1.5}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.plain::before{display:none}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-info{background:var(--info-soft);color:var(--info)}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--accent-soft);color:var(--accent-ink)}
.t-violet{background:var(--violet-soft);color:var(--violet)} .t-teal{background:var(--teal-soft);color:var(--teal)}
.t-gray{background:var(--gray-soft);color:var(--gray)}
.av{width:30px;height:30px;flex:none;display:grid;place-items:center;font:600 11px var(--f-display);background:var(--sunken);color:var(--ink-2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.av.lg{width:52px;height:52px;font-size:17px}
.hexbadge{width:38px;height:42px;display:inline-grid;place-items:center;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--ok-soft);color:var(--ok)}
.hexbadge.mid{background:var(--accent-soft);color:var(--accent-ink)}
.hexbadge.low{background:var(--bad-soft);color:var(--bad)}
.hexbadge.na{background:var(--gray-soft);color:var(--gray)}
.hexbadge.lg{width:64px;height:72px;font-size:20px}
.meter{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;min-width:60px}
.meter > i{display:block;height:100%;background:var(--ink-2)}
.meter.acc > i{background:var(--accent)}
.meter.bad > i{background:var(--bad)}
.temp{display:inline-flex;gap:2px;vertical-align:middle}
.temp i{width:5px;height:12px;border-radius:1px;background:var(--line-2)}
.temp i.on{background:var(--accent)}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2);min-width:0}
.inp,select.inp,textarea.inp{height:36px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 10px;width:100%;color:var(--ink);font-weight:400;font-size:14px;min-width:0}
textarea.inp{height:auto;padding:10px;line-height:1.5;resize:vertical}
.inp:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.help{font-size:12px;color:var(--muted);font-weight:400}
.help.warn{color:var(--accent-ink)} .help.bad{color:var(--bad)}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:36px;height:20px;margin:0;cursor:pointer}
.sw .tr{width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked + .tr{background:var(--ok)}
.sw input:checked + .tr::after{transform:translateX(16px)}
.sw input:focus-visible + .tr{outline:2px solid var(--focus);outline-offset:2px}
.sw input:disabled + .tr{opacity:.5}
.opt{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt > div{min-width:0}
.opt .ot{font-weight:600}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--ink-2);font-size:13px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--ink)}
.tabs .n{font:500 11.5px var(--f-mono);color:var(--muted);margin-left:6px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t tr.sel td{background:var(--accent-soft)}
.t .cell-main{font-weight:600}
.t .cell-sub{font-size:12px;color:var(--muted)}
.t th.num,.t td.num{text-align:right}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:var(--surface);border-radius:var(--r);margin-bottom:10px;flex-wrap:wrap}
.bulk .btn{background:transparent;color:var(--surface);border-color:rgba(255,255,255,.3)}
:root[data-theme="dark"] .bulk .btn{border-color:rgba(0,0,0,.3)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .kl{font-size:12px;color:var(--muted)}
.kpi .kv{font:600 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.02em}
.kpi .ks{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .ks b{font-weight:600;color:var(--ink-2)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 10px var(--f-mono)}
.chart .ttl{fill:var(--ink-2);font:600 11px var(--f-ui)}
.chart .sa{fill:var(--chart-a)} .chart .sb{fill:var(--chart-b)}
.chart .la{stroke:var(--chart-a);fill:none;stroke-width:2}
.chart .lb{stroke:var(--chart-b);fill:none;stroke-width:2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* rules / notices */
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--ink-2);border-radius:var(--r);background:var(--surface);font-size:13px}
.rule.warn{border-left-color:var(--accent);background:var(--accent-soft)}
.rule.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.rule.ok{border-left-color:var(--ok)}
.rule > div{min-width:0}
.rule svg{flex:none;margin-top:1px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 16px;color:var(--muted)}
svg .c1{fill:none;stroke:var(--line-2);stroke-width:1.5}
svg .c2{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.empty h3{color:var(--ink)}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:71;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-h > div{min-width:0;flex:1}
.drawer-b{flex:1;overflow-y:auto;padding:18px;padding-right:max(18px, env(safe-area-inset-right,0px))}
.drawer .tabs{margin-bottom:14px}
.modal{position:fixed;z-index:72;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop-shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--pop-shadow)}

/* map of screens */
#mapBtn{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border:1px solid var(--accent-line);background:var(--surface);color:var(--ink);border-radius:20px;cursor:pointer;font-weight:600;box-shadow:var(--pop-shadow)}
#mapBtn .mc{font:500 11.5px var(--f-mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:1px 7px}
.map-sec{margin-bottom:16px}
.map-sec h4{font:600 11.5px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.map-it{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.map-it button.lnk{flex:1;text-align:left;border:0;background:none;cursor:pointer;color:var(--ink);padding:2px 0;min-width:0}
.map-it button.lnk:hover{text-decoration:underline}
.map-it .chk{font-size:12px;color:var(--muted);flex:none}
.map-it.done button.lnk{color:var(--muted)}
.map-it .here{font-size:11px;color:var(--accent-ink);font-weight:600}

/* contas */
.state-dot{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.addr{font-family:var(--f-mono);font-size:13px}
.prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.prov button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);cursor:pointer;text-align:left}
.prov button:hover{border-color:var(--ink)}
.prov .pn{font:600 15px var(--f-display)}
.prov .pmark{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font:700 12px var(--f-display);background:var(--sunken);color:var(--ink-2)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.stp{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stp .sn{width:28px;height:32px;display:grid;place-items:center;font:600 13px var(--f-mono);background:var(--sunken);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.stp.done .sn{background:var(--ok-soft);color:var(--ok)}
.stp > div{min-width:0}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.checks > div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.checks > div:last-child{border-bottom:0}
.checks .cl{flex:1;min-width:0}

/* campaign sequence */
.seq{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.seq > *{min-width:0}
.stepcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;cursor:pointer;text-align:left;width:100%}
.stepcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.stepcard .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stepcard .ss{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wait{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
.wait::before{content:"";width:1px;height:22px;background:var(--line-2);margin-left:6px;margin-right:6px}
.wait input{width:52px;height:28px;text-align:center}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.var{font:500 12px var(--f-mono);border:1px dashed var(--line-2);background:var(--surface-2);border-radius:4px;padding:3px 7px;cursor:pointer;color:var(--ink-2)}
.var:hover{border-style:solid;border-color:var(--ink-2)}
.preview{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.preview .pv-h{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;white-space:normal}
.preview .foot{display:block;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--muted)}
.hl{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}
.ai{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px}
.ai .ai-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;color:var(--accent-ink);margin-bottom:6px}
.ai p{white-space:pre-wrap;font-size:13.5px}

/* unibox */
.ubox{display:grid;grid-template-columns:220px minmax(260px,340px) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);height:680px;overflow:hidden}
.ubox > section{min-width:0;min-height:0;display:flex;flex-direction:column}
.u-f{border-right:1px solid var(--line);overflow-y:auto;padding:12px 8px;background:var(--surface-2)}
.u-f h4{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 8px 6px}
.u-f button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 8px;border-radius:4px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13px}
.u-f button:hover{background:var(--sunken)}
.u-f button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.u-f .c{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--muted)}
.u-f .ld{width:8px;height:8px;border-radius:50%;flex:none}
.u-l{border-right:1px solid var(--line)}
.u-l .ul-h{padding:10px;border-bottom:1px solid var(--line)}
.u-l .ul-list{overflow-y:auto;flex:1}
.th{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.th:hover{background:var(--surface-2)}
.th[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.th > div{min-width:0;flex:1}
.th .tn{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.th .tn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .tt{font:400 11.5px var(--f-mono);color:var(--muted);flex:none}
.th .tc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .tx{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:3px 0 6px}
.th.unread .tn span:first-child::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:1px}
.ubox > section.u-c{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.u-c > div{min-width:0;min-height:0}
.conv{display:flex;flex-direction:column;min-height:0;height:100%}
.conv-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.conv-h > div{min-width:0}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);max-width:640px}
.msg.out{background:var(--surface-2);align-self:flex-end}
.msg .mh{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.msg .mb{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.exlbl{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);border:1px solid var(--accent-line);border-radius:3px;padding:0 5px}
.reply{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.u-side{border-left:1px solid var(--line);overflow-y:auto;padding:14px;background:var(--surface-2)}
.kv{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-size:13.5px;word-break:break-word}
.copyline{display:flex;align-items:center;gap:6px}
.copyline .sel{user-select:all;-webkit-user-select:all;font-family:var(--f-mono);font-size:13px;word-break:break-all;min-width:0}
.u-back{display:none}
.u-fsel{display:none}
.nav .ls{display:none}

/* listas */
.lcard{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%;min-width:0}
.lcard:hover{border-color:var(--line-2)}
.lcard .lt{font:600 16px var(--f-display)}
.lnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lnums b{display:block;font:600 20px var(--f-display);font-variant-numeric:tabular-nums}
.lnums span{font-size:12px;color:var(--muted)}
.bar3{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.bar3 i{display:block;height:100%}
.lcard.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--muted);min-height:200px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .inp{width:auto;height:32px;font-size:13px}
.filters .search{flex:1;min-width:180px}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface-2)}
.map-t td select{min-width:160px}
.conf{font:500 11px var(--f-mono)}

/* contato */
.contact{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.contact > *{min-width:0}
.hook{font-size:14.5px;line-height:1.55;border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.calls button{justify-content:flex-start}

/* timeline / diario */
.tl{position:relative;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:52px 28px minmax(0,1fr);gap:10px;padding:9px 0;position:relative}
.ev .et{font:400 12px var(--f-mono);color:var(--muted);padding-top:5px;text-align:right;font-variant-numeric:tabular-nums}
.ev .eg{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);position:relative;z-index:1;border:2px solid var(--surface)}
.ev::before{content:"";position:absolute;left:75px;top:0;bottom:0;width:1px;background:var(--line)}
.ev .ex{min-width:0;padding-top:4px}
.ev .ex .es{font-size:13.5px}
.ev .ex .es b{font-weight:600}
.ev .ex .em{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.ev .ex .eq{font-size:12.5px;color:var(--ink-2);margin-top:6px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;white-space:pre-wrap}
.ev.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.lk{border:0;background:none;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.lk:hover{text-decoration-color:var(--ink)}
.g-sent{background:var(--sunken)!important;color:var(--ink-2)!important}
.g-open{background:var(--gray-soft)!important;color:var(--gray)!important}
.g-reply{background:var(--ok-soft)!important;color:var(--ok)!important}
.g-label{background:var(--accent-soft)!important;color:var(--accent-ink)!important}
.g-call{background:var(--info-soft)!important;color:var(--info)!important}
.g-meet{background:var(--violet-soft)!important;color:var(--violet)!important}
.g-bounce,.g-optout{background:var(--bad-soft)!important;color:var(--bad)!important}
.g-box{background:var(--accent-soft)!important;color:var(--accent-ink)!important}
.g-member,.g-approve,.g-import,.g-camp{background:var(--teal-soft)!important;color:var(--teal)!important}
.g-closer{background:var(--violet-soft)!important;color:var(--violet)!important}
.dia{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.dia > *{min-width:0}
.dia-side{position:sticky;top:calc(var(--top-h) + 44px)}
.today{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.today button{background:var(--surface);border:0;padding:10px 12px;text-align:left;cursor:pointer;min-width:0}
.today button:hover{background:var(--surface-2)}
.today button[aria-pressed="true"]{background:var(--accent-soft)}
.today b{display:block;font:600 20px var(--f-display);font-variant-numeric:tabular-nums}
.today span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .cc{font:500 11px var(--f-mono);opacity:.75}
.dayh{position:sticky;top:calc(var(--top-h) + 25px);z-index:2;background:var(--bg);padding:12px 0 6px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);margin-bottom:4px}
.dayh h3{font-size:14px}
.dia-f summary{cursor:pointer;list-style-position:inside}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hours{display:block;width:100%;height:auto}
.hours .hb{fill:var(--chart-a)} .hours .hn{fill:var(--accent)} .hours .ax{fill:var(--muted);font:500 9px var(--f-mono)}

/* config */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.cur{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.plan .pr{font:600 26px var(--f-display)}
.plan ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.footprev{border:1px dashed var(--line-2);border-radius:var(--r);padding:12px 14px;font-size:12.5px;color:var(--muted);background:var(--surface-2)}

/* entry (login / onboarding) */
#entry{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.en-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.en-art{background:var(--side-bg);color:var(--side-ink);padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0}
.en-art .big{font:600 30px/1.15 var(--f-display);letter-spacing:-.02em;max-width:420px}
.en-art .lines{font-size:13.5px;color:var(--side-muted);display:flex;flex-direction:column;gap:8px;max-width:400px}
.en-art .lines div{display:flex;gap:10px} .en-art .lines b{color:var(--side-ink);font-weight:500}
.en-art svg.comb{position:absolute;right:-40px;bottom:-30px;opacity:.9}
.en-art svg.comb .c{fill:none;stroke:var(--side-line);stroke-width:1.5}
.en-art svg.comb .m{fill:none;stroke:var(--accent);stroke-width:1.5}
.en-art svg.comb .d{fill:var(--accent)}
.en-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.en-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.en-box .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.en-box .or::before,.en-box .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.onb-steps{display:flex;gap:6px;margin-bottom:6px}
.onb-steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.onb-steps span.on{background:var(--accent)}
.onb-steps span.done{background:var(--ink)}

/* ---------- shell: rail · secondary column · main · Kolmeia IA panel ---------- */
:root{--rail-w:52px;--sec-w:248px;--ai-w:380px}
#shellwrap{position:fixed;inset:0;display:flex;background:var(--bg)}
#rail{width:var(--rail-w);flex:none;background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:50;padding-left:env(safe-area-inset-left,0px)}
.r-ws{width:32px;height:32px;display:grid;place-items:center;border:0;cursor:pointer;background:var(--side-ink);color:var(--side-bg);font:600 11px var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-bottom:10px;flex:none}
.r-nav{display:flex;flex-direction:column;gap:4px;align-items:center;flex:1;min-height:0}
.r-btn{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:var(--r);background:none;color:var(--side-muted);cursor:pointer;padding:0}
.r-btn:hover{background:var(--side-hover);color:var(--side-ink)}
.r-btn[aria-current="page"]{background:var(--side-hover);color:var(--side-ink)}
.r-btn[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.r-btn .dot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.r-btn .rl{display:none}
.r-btn[data-tip]:hover::after,.r-btn[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font:500 12px/1.3 var(--f-ui);padding:5px 9px;border-radius:4px;white-space:nowrap;z-index:90;pointer-events:none;box-shadow:var(--pop-shadow)}
.r-sep{width:22px;border-top:1px dashed var(--side-line);margin:6px 0;flex:none}
.r-btn.extra{color:var(--side-muted);outline:1px dashed var(--side-line);outline-offset:-1px}
.r-me{width:30px;height:30px;display:grid;place-items:center;border:0;cursor:pointer;background:var(--side-hover);color:var(--side-ink);font:600 11px var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none;margin-top:4px}
.r-mobonly{display:none !important}

#frame{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#cols{flex:1;min-height:0;display:flex;position:relative}
#sec{width:var(--sec-w);flex:none;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
body.sec-off #sec,body.no-sec #sec{display:none}
.sec-h{height:var(--top-h);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px}
.sec-h h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-b{flex:1;overflow-y:auto;padding:6px 10px 16px;min-height:0}
.sec-f{flex:none;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
.sec-f .btn{flex:1}
.snav{display:flex;flex-direction:column;gap:1px}
.snav button{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;background:none;border-radius:var(--r);color:var(--ink-2);cursor:pointer;text-align:left;font-size:13.5px}
.snav button:hover{background:var(--sunken);color:var(--ink)}
.snav button[aria-current="page"],.snav button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);font-weight:600}
.snav button .c{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--muted)}
.snav button svg{flex:none;color:var(--muted)}
.snav button.sub{padding-left:30px;font-size:13px}
.sgrp{display:flex;align-items:center;gap:4px;margin:14px 0 4px;padding:0 4px 0 10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.sgrp > span{flex:1;min-width:0}
.sgrp .iconbtn{width:26px;height:26px}
.slabel{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 10px 6px}
.acc{border-bottom:1px solid var(--line)}
.acc > button{display:flex;align-items:center;width:100%;border:0;background:none;padding:10px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;font-size:13.5px;gap:8px}
.acc > button span{flex:1}
.acc > button svg{color:var(--muted);transition:transform .15s}
.acc.open > button svg{transform:rotate(180deg)}
.acc .acc-b{padding:0 10px 12px;display:flex;flex-direction:column;gap:8px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;font-size:13px}

#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.mtop{height:var(--top-h);flex:none;display:flex;align-items:center;gap:8px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:16px;border-bottom:1px solid var(--line);min-width:0}
.mt-title{display:flex;align-items:center;gap:6px;height:100%;padding-right:16px;margin-right:4px;border-right:1px solid var(--line);font:600 18px var(--f-display);white-space:nowrap;min-width:0}
.mt-title span{overflow:hidden;text-overflow:ellipsis}
.ttabs{display:flex;height:100%;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{position:relative;border:0;background:none;padding:0 12px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap;font-size:14px}
.ttabs button:hover{color:var(--ink)}
.ttabs button[aria-selected="true"]{color:var(--ink)}

const MIN=6e4,HR=36e5,DAY=864e5,NOW=Date.now();
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const T0=sod(NOW);

const dmy=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const dayLabel=t=>{const d=sod(t);if(d===T0)return 'Hoje';if(d===T0-DAY)return 'Ontem';const s=new Date(t).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});return s.charAt(0).toUpperCase()+s.slice(1)};

const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/MIN));if(m<1)return 'agora';if(m<60)return 'há '+m+' min';const h=Math.round(m/60);if(h<24)return 'há '+h+' h';return 'há '+Math.round(h/24)+' d'};

function dayChart(days,a,b,la,lb,Wd){
 const W=Wd||640,L=34,R=8,n=days.length,cw=(W-L-R)/n,bw=Math.max(2,cw*.62),H=272;
 const panel=(vals,y0,h,cls,title)=>{const m=niceMax(Math.max.apply(null,vals.concat([1])));let g='<text class="ttl" x="'+L+'" y="'+(y0-8)+'">'+title+'</text>';
  [0,.5,1].forEach(f=>{const y=y0+h-h*f;g+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+(m*f)+'</text>'});
  vals.forEach((v,i)=>{const bh=h*v/m;if(v)g+='<rect class="'+cls+'" x="'+(L+i*cw+(cw-bw)/2).toFixed(1)+'" y="'+(y0+h-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1"><title>'+dmy(days[i])+': '+v+'</title></rect>'});return g};
 let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+la+' e '+lb+' por dia">'+panel(a,26,120,'sa',la)+panel(b,190,56,'sb',lb);
 const stp=n>20?5:n>10?2:1;days.forEach((d,i)=>{if((n-1-i)%stp===0){const D=new Date(d);s+='<text class="ax" x="'+(L+i*cw+cw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+D.getDate()+'/'+(D.getMonth()+1)+'</text>'}});
 return s+'</svg>';
}

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]'),a=e.target.closest('[data-act]');
 const inter=e.target.closest('input,select,textarea,label');
 if(a&&(!g||g.contains(a))){const f=ACT[a.dataset.act];if(f){f(a,e)}if(!(a.dataset.go))return}
 if(g){if(inter&&g.contains(inter)&&inter!==g)return;e.preventDefault();closePops();if(!$('#mapwrap').hidden&&!g.closest('#mapwrap'))ACT.mapClose();go(g.dataset.go);return}
 if(!e.target.closest('.pop'))closePops();
});
const onEv=e=>{const el=e.target;if(!el||!el.dataset||!el.dataset.on)return;const f=ON[el.dataset.on];if(f)f(el,e)};
document.addEventListener('input',e=>{const el=e.target;if(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT')return;onEv(e)});
document.addEventListener('change',e=>{const el=e.target;if(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT'||['warmF','seqWait','agF','optDaily'].includes(el.dataset&&el.dataset.on))onEv(e)});

 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-go]')){e.preventDefault();go(e.target.dataset.go)}
});


/* ================= popover placement (works from the rail, the top bar and the bottom bar) ================= */
function openPop(html,anchor,rect){
 const r=rect||anchor.getBoundingClientRect();closePops();const p=document.createElement('div');p.className='pop';p.innerHTML=html;p.style.maxHeight=(window.innerHeight-24)+'px';p.style.overflowY='auto';document.body.appendChild(p);
 const w=p.offsetWidth,h=p.offsetHeight,W=window.innerWidth,H=window.innerHeight;let left,top;
 if(r.right<70&&W>760){left=r.right+8;top=Math.min(Math.max(12,r.top),H-h-12)}
 else{left=r.left<W/2?Math.max(12,Math.min(r.left,W-w-12)):Math.min(W-w-12,Math.max(12,r.right-w));top=r.bottom+6;if(top+h>H-12)top=Math.max(12,r.top-h-6)}
 p.style.position='fixed';p.style.left=left+'px';p.style.top=top+'px';const f=p.querySelector('button');if(f)f.focus()}
